[build]
  base = "client"
  command = "npm ci && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"
  CI = "false"

# React Router (SPA): serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
